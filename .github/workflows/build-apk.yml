name: Build thinn-khi V9 Atmosphere APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android command line SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract V9 ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f thinn-khi_Android_Source_V9.zip || { echo 'Please upload thinn-khi_Android_Source_V9.zip to repository root'; exit 1; }
          mkdir -p extracted
          unzip -qo thinn-khi_Android_Source_V9.zip -d extracted
          PROJECT_DIR=extracted/thinn-khi_Android_Project
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Install FFmpeg audio tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
      - name: Fetch public-domain rain recordings and create seamless loops
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/prepare_real_weather_audio.py"
          for asset in light_rain heavy_rain thunder_strike; do
            test -s "$PROJECT_DIR/app/src/main/res/raw/$asset.ogg" || exit 1
          done
      - name: Compile debug APK
        id: compile
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --project-dir "$PROJECT_DIR" :app:assembleDebug 2>&1 | tee build.log
      - name: Extract Kotlin errors and build report
        if: steps.compile.outcome == 'failure'
        shell: bash
        run: |
          grep -n -E '(e: file:|Unresolved reference|Type mismatch|[Ee]rror:|Compilation error|^FAILURE:|^\* What went wrong:)' build.log | head -130 > compiler-errors.txt || true
          if [[ ! -s compiler-errors.txt ]]; then tail -130 build.log > compiler-errors.txt; fi
          echo '### thinn-khi V9 compilation errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat compiler-errors.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure log
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V9-errors
          path: |
            build.log
            compiler-errors.txt
          if-no-files-found: error
      - name: Upload installable APK
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V9-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Fail visibly on compilation error
        if: steps.compile.outcome == 'failure'
        run: exit 1
