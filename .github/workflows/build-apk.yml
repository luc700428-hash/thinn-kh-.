
name: Build thinn-khi V20.0 APK and OTA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '正式發布 OTA'
        type: boolean
        required: true
        default: false
      release_notes:
        description: '選填：更新說明，留空使用 APK 內建說明'
        type: string
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check official signing credentials
        shell: bash
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          PUBLISH_RELEASE: ${{ inputs.publish_release == true }}
        run: |
          set -euo pipefail
          SIGN_READY=true
          for key in APK_KEYSTORE_BASE64 APK_KEYSTORE_PASSWORD APK_KEY_PASSWORD APK_KEY_ALIAS; do
            if [[ -z "${!key:-}" ]]; then SIGN_READY=false; fi
          done
          echo "SIGN_READY=$SIGN_READY" >> "$GITHUB_ENV"
          if [[ "$PUBLISH_RELEASE" == 'true' && "$SIGN_READY" != 'true' ]]; then
            echo '::error::正式 OTA 必須設定完整的四組簽署 Secrets'
            exit 1
          fi
          if [[ "$SIGN_READY" == 'true' ]]; then
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thinn-khi-release.jks"
            chmod 600 "$RUNNER_TEMP/thinn-khi-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/thinn-khi-release.jks" \
              -storepass "$APK_KEYSTORE_PASSWORD" -alias "$APK_KEY_ALIAS" >/dev/null
          fi

      - name: Extract V20.0 Android source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP='thinn-khi_Android_Source_V20_0_Universal_Glass_Seismic.zip'
          if [[ ! -s "$SOURCE_ZIP" ]]; then
            echo "::error::找不到根目錄的 $SOURCE_ZIP"
            find . -maxdepth 1 -type f -name '*.zip' -print || true
            exit 1
          fi
          unzip -tqq "$SOURCE_ZIP"
          mkdir -p extracted
          unzip -qo "$SOURCE_ZIP" -d extracted
          PROJECT_DIR='extracted/thinn-khi_Android_Project'
          test -s "$PROJECT_DIR/app/build.gradle.kts"
          test -s "$PROJECT_DIR/app/src/main/assets/current_release_notes.md"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((20000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=20.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare update notes
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          NOTES_FILE="$PROJECT_DIR/app/src/main/assets/current_release_notes.md"
          if [[ -n "${RELEASE_NOTES:-}" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"
          fi
          test -s "$NOTES_FILE"
          echo "RELEASE_NOTES_PATH=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Prepare weather audio
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 "$PROJECT_DIR/tools/prepare_real_weather_audio.py"
          for sound in light_rain heavy_rain thunder_strike; do
            test -s "$PROJECT_DIR/app/src/main/res/raw/$sound.ogg"
          done

      - name: Compile Android APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SIGN_READY" == 'true' ]]; then
            TASK=':app:assembleRelease'
          else
            TASK=':app:assembleDebug'
          fi
          gradle --no-daemon --console=plain --project-dir "$PROJECT_DIR" \
            -PTHINN_VERSION_CODE="$VERSION_CODE" \
            -PTHINN_VERSION_NAME="$VERSION_NAME" "$TASK" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V20_0-errors
          path: build.log
          if-no-files-found: ignore

      - name: Sign release APK and create SHA-256
        if: env.SIGN_READY == 'true'
        shell: bash
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          UNSIGNED="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/thinn-khi-release.jks" \
            --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass env:APK_KEYSTORE_PASSWORD \
            --key-pass env:APK_KEY_PASSWORD \
            --out thinn-khi.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose thinn-khi.apk
          sha256sum thinn-khi.apk > thinn-khi.apk.sha256
          rm -f "$RUNNER_TEMP/thinn-khi-release.jks"

      - name: Upload signed APK
        if: env.SIGN_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V20_0-SIGNED-APK
          path: |
            thinn-khi.apk
            thinn-khi.apk.sha256
          if-no-files-found: error

      - name: Upload debug APK
        if: env.SIGN_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V20_0-TEST-APK-NOT-OTA
          path: extracted/thinn-khi_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish official OTA release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && env.SIGN_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION_NAME}" thinn-khi.apk thinn-khi.apk.sha256 \
            --title "thinn-khi ${VERSION_NAME}" \
            --notes-file "$RELEASE_NOTES_PATH" \
            --latest
