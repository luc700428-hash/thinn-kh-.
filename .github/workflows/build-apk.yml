
name: Build thinn-khi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f thinn-khi_Android_Source.zip ]]; then
            mkdir -p extracted
            unzip -q thinn-khi_Android_Source.zip -d extracted
            PROJECT_DIR=extracted/thinn-khi_Android_Project
          elif [[ -f thinn-khi_Android_Project/settings.gradle.kts ]]; then
            PROJECT_DIR=thinn-khi_Android_Project
          elif [[ -f settings.gradle.kts ]]; then
            PROJECT_DIR=.
          else
            echo 'ERROR: Upload thinn-khi_Android_Source.zip to the root of this repository.'
            exit 1
          fi
          test -f "$PROJECT_DIR/app/build.gradle.kts" || {
            echo "ERROR: Android project not found inside $PROJECT_DIR"
            exit 1
          }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compile APK
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
