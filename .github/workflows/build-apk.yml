name: Build thinn-khi V2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate V2 Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f thinn-khi_Android_Source_V2.zip ]]; then
            mkdir -p extracted
            unzip -qo thinn-khi_Android_Source_V2.zip -d extracted
            PROJECT_DIR=extracted/thinn-khi_Android_Project
          elif [[ -f thinn-khi_Android_Project/app/build.gradle.kts ]]; then
            PROJECT_DIR=thinn-khi_Android_Project
          elif [[ -f app/build.gradle.kts ]]; then
            PROJECT_DIR=.
          else
            echo 'Missing thinn-khi_Android_Source_V2.zip at repository root.'
            exit 1
          fi
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compile V2 APK
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --project-dir "$PROJECT_DIR" :app:assembleDebug 2>&1 | tee build.log

      - name: Show Kotlin compile errors
        if: steps.compile.outcome == 'failure'
        shell: bash
        run: |
          grep -n -E '(e: file:|Unresolved reference|Type mismatch|[Ee]rror:|Compilation error|^FAILURE:)' build.log | head -100 > compiler-errors.txt || true
          if [[ ! -s compiler-errors.txt ]]; then tail -120 build.log > compiler-errors.txt; fi
          echo '### thinn-khì V2 編譯錯誤' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          head -100 compiler-errors.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat compiler-errors.txt

      - name: Upload compilation error logs
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V2-build-errors
          path: |
            build.log
            compiler-errors.txt
          if-no-files-found: error

      - name: Upload installable debug APK
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail workflow if compile failed
        if: steps.compile.outcome == 'failure'
        run: exit 1
