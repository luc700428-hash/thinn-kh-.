name: Build thinn-khi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Android project
        run: unzip -q thinn-khi_Android_Source.zip -d extracted
      - name: Compile APK
        working-directory: extracted/thinn-khi_Android_Project
        run: gradle --no-daemon :app:assembleDebug
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-APK
          path: extracted/thinn-khi_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
