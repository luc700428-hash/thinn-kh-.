name: Build thinn-khì V25 candidate and single verified OTA
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'FULL V25 ONLY: all 22 independently evidenced feature checks required'
        type: boolean
        required: true
        default: false
      publish_maintenance:
        description: 'Publish signed STABLE MAINTENANCE OTA for all users (NOT full V25)'
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android API 36 and tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tracked Android source (not a pinned archive)
        shell: bash
        run: |
          set -euo pipefail
          project=android-project
          test -s "$project/app/src/main/java/io/atmos/weather/MainActivity.kt"
          test -s "$project/app/src/main/java/io/atmos/weather/ui/ThinnDesignTokens.kt"
          test -s "$project/app/src/main/java/io/atmos/weather/ui/ThinnComponents.kt"
          test -s "$project/app/src/main/java/io/atmos/weather/ui/GlassNavigation.kt"
          test -s "$project/app/src/main/java/io/atmos/weather/ui/ThinnOpticalMaterial.kt"
          test -s "$project/app/src/main/java/io/atmos/weather/ui/ThinnAtmosphereFocus.kt"
          # R10 alarm, cross-border EEW scope and local-only simulation release gates.
          for path in alarm/R10AlarmDesign.kt alarm/WeatherAlarmNarration.kt alarm/WeatherAlarmSpeechCache.kt earthquake/TaiwanEewScope.kt earthquake/SeismicSimulation.kt earthquake/SeismicTrainingVoice.kt; do
            test -s "$project/app/src/main/java/io/atmos/weather/$path"
          done
          for sound in dawn dawn_rain rain rain_clear wood water fire metal; do
            test -s "$project/app/src/main/res/raw/thinn_alarm_${sound}.ogg"
          done

          test ! -e "$project/app/src/main/java/io/atmos/weather/presentation/home/LandmarkGalleryPage.kt"
          test ! -e "$project/app/src/main/assets/landmarks/illustrations"
          test -s "$project/app/src/main/java/io/atmos/weather/task/TaskCenterPage.kt"
          test -s "$project/app/src/main/java/io/atmos/weather/task/TaskReminderScheduler.kt"
          test -s "$project/app/src/main/java/io/atmos/weather/earthquake/SeismicPrimaryTab.kt"
          test -s "$project/app/src/main/java/io/atmos/weather/presentation/home/HomeWeatherBriefing.kt"
          # Explicit opt-out from all 3D landmark models; GIS / real maps remain untouched.
          test ! -e "$project/app/src/main/assets/landmarks"
          test ! -e "$project/app/src/main/java/io/atmos/weather/visual/FilamentLandmark.kt"
          test ! -e "$project/app/src/main/java/io/atmos/weather/domain/visual/LandmarkRegistry.kt"
          ! grep -q 'filament-utils-android' "$project/app/build.gradle.kts"
          test -s "$project/app/src/main/java/io/atmos/weather/widgets/AtmosWidgets.kt"
          test -s "$project/app/src/main/java/io/atmos/weather/ui/RadarHistoryDialog.kt"
          grep -Fq 'releases/latest/download/ota.json' "$project/app/src/main/java/io/atmos/weather/update/AppUpdater.kt"
          test -s "$project/backend/functions/index.js"
          test -s "$project/backend/functions/cwa_official.cjs"
          test -s "$project/app/src/main/java/io/atmos/weather/earthquake/CwaOfficialGateway.kt"
          test ! -e "$project/app/src/main/java/io/atmos/weather/earthquake/BundledCwaKey.kt" || {
            echo '::error::Remove old hard-coded CWA credentials from tracked Android source'; exit 1;
          }
          if grep -R -q -E 'CWA-[A-Z0-9]{8}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{12}' "$project/app/src/main/java"; then
            echo '::error::Potential hard-coded CWA authorization key in source'; exit 1;
          fi
          grep -Fq 'targetSdk = 36' "$project/app/build.gradle.kts"
          echo "Building tracked source commit: $GITHUB_SHA"
      - name: Inject source provenance into the app package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPROOF'
          import hashlib,json,os,pathlib
          root=pathlib.Path('android-project')
          sources=[
            'app/src/main/java/io/atmos/weather/presentation/home/WeatherHomeScreen.kt',
            'app/src/main/java/io/atmos/weather/update/AppUpdatePage.kt',
          ]
          # Hash all app sources and resources, not just the Git commit hash.
          # A version-only commit must not masquerade as an app-feature update.
          app_files=sorted(p for p in (root/'app/src/main').rglob('*')
                           if p.is_file() and p.name!='build_source_proof.json')
          app_files.append(root/'app/build.gradle.kts')
          tree=hashlib.sha256()
          for f in app_files:
              tree.update(str(f.relative_to(root)).encode('utf-8')+b'\0')
              tree.update(hashlib.sha256(f.read_bytes()).digest())
          proof={'schema':1,'commit_sha':os.environ['GITHUB_SHA'],
                 'app_tree_sha256':tree.hexdigest(),
                 'source_sha256':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in sources}}
          rendered=json.dumps(proof,ensure_ascii=False,indent=2)+'\n'
          (root/'app/src/main/assets/build_source_proof.json').write_text(rendered,encoding='utf-8')
          pathlib.Path('expected-build-source-proof.json').write_text(rendered,encoding='utf-8')
          print('Source audit SHA:',proof['commit_sha'])
          PYPROOF
      - name: Test Azure Speech Worker request and safety contracts
        run: node --test android-project/backend/azure-speech-worker/worker.test.js
      - name: Test public OTA manifest generator
        run: python3 -m unittest discover -s android-project/tools/tests -p test_*.py -v
      - name: Restore public-domain rain and thunder recordings BEFORE Kotlin compile
        shell: bash
        run: |
          set -euo pipefail
          project=android-project
          prep="$project/tools/prepare_real_weather_audio.py"
          raw="$project/app/src/main/res/raw"
          test -s "$prep" || { echo '::error::Weather audio preparation script missing from V22 source.'; exit 1; }
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          # These are three public-domain Wikimedia Commons field recordings.
          # The existing source script creates local, crossfaded Ogg Vorbis assets.
          python3 "$prep"
          for name in light_rain heavy_rain thunder_strike; do
            sound="$raw/$name.ogg"
            test -s "$sound" || { echo "::error::Missing generated raw resource $sound"; exit 1; }
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$sound")"
            test "$codec" = vorbis || { echo "::error::$name has unexpected audio codec: $codec"; exit 1; }
            echo "Weather audio verified: $name.ogg ($(stat -c%s "$sound") bytes)"
          done
      - name: Node backend policy regression tests
        run: node --test android-project/backend/tests/*.test.cjs
      - name: NEXT complete feature acceptance gate
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: bash
        run: |
          python3 android-project/tools/verify_v25_release_evidence.py
          python3 android-project/tools/verify_next_release_gate.py
      - name: Validate mutually exclusive official OTA modes
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          FULL_V25: ${{ inputs.publish_release == true }}
          MAINTENANCE: ${{ inputs.publish_maintenance == true }}
        run: |
          set -euo pipefail
          if [[ "$FULL_V25" == 'true' && "$MAINTENANCE" == 'true' ]]; then
            echo '::error::Choose only one official release mode: full V25 OR stable maintenance.'
            exit 1
          fi
      - name: Prepare signing mode
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          PUBLISH_RELEASE: ${{ inputs.publish_release == true || inputs.publish_maintenance == true }}
        shell: bash
        run: |
          set -euo pipefail
          SIGN_READY=true
          for name in APK_KEYSTORE_BASE64 APK_KEYSTORE_PASSWORD APK_KEY_PASSWORD APK_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then SIGN_READY=false; fi
          done
          echo "SIGN_READY=$SIGN_READY" >> "$GITHUB_ENV"
          if [[ "$PUBLISH_RELEASE" == 'true' && "$SIGN_READY" != 'true' ]]; then
            echo '::error::OTA publication requires the original app release signing credentials.'; exit 1
          fi
          if [[ "$SIGN_READY" == 'true' ]]; then
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thinn-release.jks"
            chmod 600 "$RUNNER_TEMP/thinn-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/thinn-release.jks" -alias "$APK_KEY_ALIAS" -storepass "$APK_KEYSTORE_PASSWORD" >/dev/null
          fi
      - name: Compile Android and run unit tests
        shell: bash
        env:
          THINN_FIREBASE_APP_ID: ${{ vars.THINN_FIREBASE_APP_ID }}
          THINN_FIREBASE_API_KEY: ${{ vars.THINN_FIREBASE_API_KEY }}
          THINN_FIREBASE_SENDER_ID: ${{ vars.THINN_FIREBASE_SENDER_ID }}
          THINN_FIREBASE_PROJECT_ID: ${{ vars.THINN_FIREBASE_PROJECT_ID }}
          THINN_PUSH_FUNCTIONS_REGION: ${{ vars.THINN_PUSH_FUNCTIONS_REGION }}
          THINN_AZURE_PROXY_URL: ${{ vars.THINN_AZURE_PROXY_URL }}
        run: |
          set -euo pipefail
          project=android-project
          args=(--no-daemon --console=plain --project-dir "$project"
             -PTHINN_VERSION_CODE="$((25000000 + GITHUB_RUN_NUMBER))"
             -PTHINN_VERSION_NAME="25.0.$GITHUB_RUN_NUMBER"
             -PTHINN_BUILD_SHA="$GITHUB_SHA"
             -PTHINN_OTA_CHANNEL="${{ (inputs.publish_release == true || inputs.publish_maintenance == true) && 'official' || 'preview' }}"
             -PTHINN_FIREBASE_APP_ID="${THINN_FIREBASE_APP_ID:-}"
             -PTHINN_FIREBASE_API_KEY="${THINN_FIREBASE_API_KEY:-}"
             -PTHINN_FIREBASE_SENDER_ID="${THINN_FIREBASE_SENDER_ID:-}"
             -PTHINN_FIREBASE_PROJECT_ID="${THINN_FIREBASE_PROJECT_ID:-}"
             -PTHINN_PUSH_FUNCTIONS_REGION="${THINN_PUSH_FUNCTIONS_REGION:-asia-east1}"
             -PTHINN_AZURE_PROXY_URL="${THINN_AZURE_PROXY_URL:-}")
          gradle "${args[@]}" :app:testDebugUnitTest 2>&1 | tee build.log
          if [[ "$SIGN_READY" == 'true' ]]; then task=:app:assembleRelease; else task=:app:assembleDebug; fi
          gradle "${args[@]}" "$task" 2>&1 | tee -a build.log
      - name: Upload CI diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-ota-build-errors
          path: build.log
          if-no-files-found: ignore
      - name: Sign and verify same-package official OTA
        if: env.SIGN_READY == 'true'
        shell: bash
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          input=android-project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$input"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$input" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/thinn-release.jks" --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass env:APK_KEYSTORE_PASSWORD --key-pass env:APK_KEY_PASSWORD \
            --out thinn-khi.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs thinn-khi.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging thinn-khi.apk > "$RUNNER_TEMP/badging.txt"
          grep -q "name='io.atmos.weather'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='$((25000000 + GITHUB_RUN_NUMBER))'" "$RUNNER_TEMP/badging.txt"
          # This must be the APK built from this commit, NOT the pinned historical ZIP.
          unzip -p thinn-khi.apk assets/build_source_proof.json > embedded-build-source-proof.json
          cmp expected-build-source-proof.json embedded-build-source-proof.json || {
            echo '::error::Signed APK does not contain the expected Android source fingerprint'; exit 1;
          }
          sha256sum thinn-khi.apk > thinn-khi.apk.sha256
          rm -f "$RUNNER_TEMP/thinn-release.jks"
      - name: Verify OTA upgrade compatibility with the current published APK
        # Preflight signed candidate builds as well; publishing still needs the NEXT 22 gate.
        if: env.SIGN_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          latest_tag="$(gh release view --repo "$repo" --json tagName --jq '.tagName')"
          # Upgrade from v22 to v23; future v23 patch releases also allowed.
          if [[ "$latest_tag" =~ ^v(22|23|25)[.]0[.]([0-9]+)$ ]]; then
            previous_major="${BASH_REMATCH[1]}"
            previous_patch="${BASH_REMATCH[2]}"
          else
            echo "::error::Cannot verify upgrade against existing release tag: $latest_tag"; exit 1
          fi
          if (( previous_major == 25 && GITHUB_RUN_NUMBER <= previous_patch )); then
            echo "::error::New OTA version is not later than $latest_tag"; exit 1
          fi
          old_dir="$RUNNER_TEMP/previous-official-ota"
          mkdir -p "$old_dir"
          gh release download "$latest_tag" --repo "$repo" --pattern 'thinn-khi.apk' --dir "$old_dir"
          old_apk="$old_dir/thinn-khi.apk"
          test -s "$old_apk"
          signer_tool="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          old_cert="$("$signer_tool" verify --print-certs "$old_apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          new_cert="$("$signer_tool" verify --print-certs thinn-khi.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          if [[ -z "$old_cert" || -z "$new_cert" || "$old_cert" != "$new_cert" ]]; then
            echo '::error::Official APK signature differs from the previously published APK. OTA would fail to install.'
            exit 1
          fi
          old_package="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$old_apk" | grep '^package:' | head -n1)"
          [[ "$old_package" == *"name='io.atmos.weather'"* ]] || {
            echo '::error::Previous APK package mismatch'; exit 1;
          }
          echo 'OTA upgrade certificate verified against previous official release.'
          # If an earlier release already carries provenance, reject unchanged app
          # content. A new run number alone is not a substantive OTA update.
          if gh release view "$latest_tag" --repo "$repo" --json assets --jq '.assets[].name' | grep -qx 'embedded-build-source-proof.json'; then
            gh release download "$latest_tag" --repo "$repo" \
              --pattern 'embedded-build-source-proof.json' --dir "$old_dir"
            python3 - "$old_dir/embedded-build-source-proof.json" embedded-build-source-proof.json <<'PYCOMPARE'
          import json,sys
          old=json.load(open(sys.argv[1],encoding='utf-8'))
          new=json.load(open(sys.argv[2],encoding='utf-8'))
          if old.get('app_tree_sha256') == new.get('app_tree_sha256'):
              raise SystemExit('ERROR: APK app sources are identical to the previous release; refusing version-only OTA')
          PYCOMPARE
          fi
      - name: Produce public OTA manifest from signed APK
        if: env.SIGN_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          preview_args=()
          notes_file=android-project/app/src/main/assets/current_release_notes.md
          # Maintenance OTA is allowed as a signed *stable patch*, not a declaration
          # that the complete 22-feature V25 scope has finished acceptance.
          if [[ "${{ inputs.publish_maintenance == true }}" == 'true' ]]; then
            notes_file=android-project/tools/stable_maintenance_notes.md
          fi
          # Signed build from main becomes a labelled preview, NEVER the official Latest.
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then preview_args+=(--preview); fi
          python3 android-project/tools/create_ota_manifest.py \
            --apk thinn-khi.apk \
            --notes "$notes_file" \
            --version "25.0.$GITHUB_RUN_NUMBER" \
            --version-code "$((25000000 + GITHUB_RUN_NUMBER))" \
            --output ota.json "${preview_args[@]}"
          test -s ota.json
          # Validate JSON and verify the published digest against the built signed APK.
          python3 -m json.tool ota.json >/dev/null
          python3 - <<'PYVERIFY'
          import hashlib,json
          with open('ota.json', encoding='utf-8') as f: m=json.load(f)
          with open('thinn-khi.apk','rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert m['sha256']==digest
          PYVERIFY
      - name: Verify Android debug APK contains expected source (unsigned candidate)
        if: env.SIGN_READY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          apk=android-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -p "$apk" assets/build_source_proof.json > embedded-build-source-proof.json
          cmp expected-build-source-proof.json embedded-build-source-proof.json || {
            echo '::error::Debug APK source fingerprint mismatch'; exit 1;
          }
      - name: Signed OTA artifacts
        if: env.SIGN_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-candidate-SIGNED-OTA
          path: |
            thinn-khi.apk
            thinn-khi.apk.sha256
            ota.json
            embedded-build-source-proof.json
      - name: Debug test artifact (NOT OTA)
        if: env.SIGN_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-debug-TEST-NOT-OTA
          path: |
            android-project/app/build/outputs/apk/debug/*.apk
            embedded-build-source-proof.json
      - name: Publish V25 test OTA (pre-release only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGN_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v25-preview
          repo="$GITHUB_REPOSITORY"
          latest_sha="$(gh api "repos/$repo/commits/main" --jq '.sha')"
          [[ "$latest_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main changed while test OTA was building"; exit 1;
          }
          # Make it impossible to turn this preview tag into an official latest release.
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            is_pre="$(gh release view "$tag" --repo "$repo" --json isPrerelease --jq .isPrerelease)"
            [[ "$is_pre" == 'true' ]] || {
              echo '::error::Refuse overwrite: preview tag is not a prerelease'; exit 1;
            }
            # Never publish the same app sources under a newer version number.
            previous="$RUNNER_TEMP/previous-preview"
            mkdir -p "$previous"
            gh release download "$tag" --repo "$repo" --dir "$previous"               --pattern embedded-build-source-proof.json --pattern ota.json
            python3 - "$previous" embedded-build-source-proof.json ota.json <<'PYCHECKPREVIEW'
          import json,pathlib,sys
          old=pathlib.Path(sys.argv[1]); fresh=pathlib.Path(sys.argv[2]); new_meta=pathlib.Path(sys.argv[3])
          before=json.loads((old/'embedded-build-source-proof.json').read_text())
          after=json.loads(fresh.read_text())
          old_manifest=json.loads((old/'ota.json').read_text())
          new_manifest=json.loads(new_meta.read_text())
          if before.get('app_tree_sha256') == after.get('app_tree_sha256'):
              pathlib.Path('preview_noop.flag').write_text('Unchanged App sources')
              print('::notice::Workflow-only commit: existing preview APK retained')
              raise SystemExit(0)
          if new_manifest['version_code'] <= old_manifest['version_code']:
              raise SystemExit('::error::Preview OTA versionCode did not increase')
          PYCHECKPREVIEW
            if [[ -f preview_noop.flag ]]; then
              echo 'App files unchanged: no new preview release, old preview remains intact.'
              exit 0
            fi
            # Upload APK before manifest. Clients verify SHA256 and cannot install a mismatch.
            for asset in thinn-khi.apk thinn-khi.apk.sha256 embedded-build-source-proof.json ota.json; do
              gh release upload "$tag" "$asset" --repo "$repo" --clobber
            done
            gh release edit "$tag" --repo "$repo" --prerelease --latest=false \
              --title "thinn-khì V25 TEST — ${GITHUB_RUN_NUMBER}" \
              --notes "V25 TEST CHANNEL ONLY. Signed candidate, not the complete V25 release. Commit: $GITHUB_SHA"
          else
            gh release create "$tag" thinn-khi.apk thinn-khi.apk.sha256 embedded-build-source-proof.json ota.json \
              --repo "$repo" --target "$GITHUB_SHA" \
              --title "thinn-khì V25 TEST — ${GITHUB_RUN_NUMBER}" \
              --notes "V25 TEST CHANNEL ONLY. Signed candidate, not the complete V25 release. Commit: $GITHUB_SHA" \
              --prerelease --latest=false
          fi
          [[ "$(gh release view "$tag" --repo "$repo" --json isPrerelease --jq .isPrerelease)" == 'true' ]]
          # GitHub's latest release endpoint excludes prereleases; never change stable latest.
          [[ "$(gh api "repos/$repo/releases/latest" --jq .tag_name)" != "$tag" ]]
      - name: Publish official OTA GitHub Release
        if: github.event_name == 'workflow_dispatch' && (inputs.publish_release == true || inputs.publish_maintenance == true) && env.SIGN_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo '::error::Only main can publish OTA'; exit 1; }
          # Don't release an obsolete build if main changed during the CI run.
          latest_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          [[ "$latest_sha" == "$GITHUB_SHA" ]] || {
            echo "::error::main advanced since this build ($GITHUB_SHA versus $latest_sha)"; exit 1;
          }
          version="25.0.$GITHUB_RUN_NUMBER"
          if [[ "${{ inputs.publish_maintenance == true }}" == 'true' ]]; then
            notes_file=android-project/tools/stable_maintenance_notes.md
            release_title="thinn-khì $version — 正式維護更新（非完整 V25）"
          else
            notes_file=android-project/app/src/main/assets/current_release_notes.md
            release_title="thinn-khì $version — 完整 V25"
          fi
          test -s "$notes_file"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Release tag already exists. Refusing duplicate or overwrite.'
            exit 1
          fi
          gh release create "v$version" thinn-khi.apk thinn-khi.apk.sha256 ota.json embedded-build-source-proof.json \
            --target "$GITHUB_SHA" --title "$release_title" \
            --notes-file "$notes_file" --latest
          [[ "$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" == 'false' ]]
  next_lab:
    name: NEXT clean-room Android lab APK (side by side)
    if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main' && inputs.publish_release != true && inputs.publish_maintenance != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: NEXT source and safety regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s thinn-next/tools -p 'test_*.py' -v
      - name: Compile new native Android app and run unit tests
        run: gradle --no-daemon --console=plain --project-dir thinn-next :app:testDebugUnitTest :app:assembleDebug
      - name: Verify new APK cannot replace currently installed thinn-khì
        shell: bash
        run: |
          set -euo pipefail
          apk='thinn-next/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > next-debug-badging.txt
          grep -Fq "name='io.atmos.weather.nextioslab'" next-debug-badging.txt || {
            echo '::error::Lab APK must never reuse the installed app package'; exit 1;
          }
          sha256sum "$apk" > thinn-next-lab-debug.sha256
      - name: Attach the separately installable lab APK
        uses: actions/upload-artifact@v4
        with:
          name: thinn-next-lab-apk-${{ github.run_number }}
          if-no-files-found: error
          path: |
            thinn-next/app/build/outputs/apk/debug/app-debug.apk
            thinn-next-lab-debug.sha256
            next-debug-badging.txt
