name: Build thinn-khì V22.0 Android OTA (archive + weather audio fixed)
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish an official signed OTA GitHub Release'
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Android API 36 and tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned V22 source archive
        shell: bash
        run: |
          set -euo pipefail
          source_archive='thinn-khi_Android_Source_V22_0_GradleDSL_Fixed.zip'
          if [[ ! -s "$source_archive" ]]; then
            echo '::notice::Standalone source archive absent; retrieving verified source from the already committed V22 OTA bundle.'
            shopt -s nullglob
            bundles=(thinn-khi_V22_0_Gradle*OTA*.zip)
            if [[ ${#bundles[@]} -ne 1 ]]; then
              echo "::error::Expected exactly one V22 Gradle-fixed OTA bundle, found ${#bundles[@]}."; exit 1
            fi
            echo "d973bcbea1ba378a3be98b7e38bfcda85bd4d5330ea7030097b61c6c11e3ddf4  ${bundles[0]}" | sha256sum -c -
            unzip -p "${bundles[0]}" "$source_archive" > "$source_archive"
          fi
          echo "7254ce215fcfbfc20f06ddeda1f4e85613ca7fc819275067b55f1c9b4eb2b76e  $source_archive" | sha256sum -c -
          unzip -tqq 'thinn-khi_Android_Source_V22_0_GradleDSL_Fixed.zip'
          mkdir -p extracted
          unzip -qo 'thinn-khi_Android_Source_V22_0_GradleDSL_Fixed.zip' -d extracted
          test -s extracted/thinn-khi_Android_Project/app/src/main/java/io/atmos/weather/push/ThinnFirebaseMessagingService.kt
          test -s extracted/thinn-khi_Android_Project/app/src/main/java/io/atmos/weather/widgets/SafetyWidget.kt
          test -s extracted/thinn-khi_Android_Project/backend/functions/index.js
          for n in $(seq -w 0 21); do
            test -s "extracted/thinn-khi_Android_Project/app/src/main/assets/landmarks/tw_${n}.glb"
            test -s "extracted/thinn-khi_Android_Project/app/src/main/assets/landmarks/previews/tw_${n}.png"
          done
          grep -Fq 'targetSdk = 36' extracted/thinn-khi_Android_Project/app/build.gradle.kts
      - name: Restore public-domain rain and thunder recordings BEFORE Kotlin compile
        shell: bash
        run: |
          set -euo pipefail
          project=extracted/thinn-khi_Android_Project
          prep="$project/tools/prepare_real_weather_audio.py"
          raw="$project/app/src/main/res/raw"
          test -s "$prep" || { echo '::error::Weather audio preparation script missing from V22 source.'; exit 1; }
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          # These are three public-domain Wikimedia Commons field recordings.
          # The existing source script creates local, crossfaded Ogg Vorbis assets.
          python3 "$prep"
          for name in light_rain heavy_rain thunder_strike; do
            sound="$raw/$name.ogg"
            test -s "$sound" || { echo "::error::Missing generated raw resource $sound"; exit 1; }
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$sound")"
            test "$codec" = vorbis || { echo "::error::$name has unexpected audio codec: $codec"; exit 1; }
            echo "Weather audio verified: $name.ogg ($(stat -c%s "$sound") bytes)"
          done
      - name: Node backend policy regression tests
        run: node --test extracted/thinn-khi_Android_Project/backend/tests/*.test.cjs
      - name: Prepare signing mode
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          PUBLISH_RELEASE: ${{ inputs.publish_release == true }}
        shell: bash
        run: |
          set -euo pipefail
          SIGN_READY=true
          for name in APK_KEYSTORE_BASE64 APK_KEYSTORE_PASSWORD APK_KEY_PASSWORD APK_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then SIGN_READY=false; fi
          done
          echo "SIGN_READY=$SIGN_READY" >> "$GITHUB_ENV"
          if [[ "$PUBLISH_RELEASE" == 'true' && "$SIGN_READY" != 'true' ]]; then
            echo '::error::OTA publication requires the original app release signing credentials.'; exit 1
          fi
          if [[ "$SIGN_READY" == 'true' ]]; then
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thinn-release.jks"
            chmod 600 "$RUNNER_TEMP/thinn-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/thinn-release.jks" -alias "$APK_KEY_ALIAS" -storepass "$APK_KEYSTORE_PASSWORD" >/dev/null
          fi
      - name: Compile Android and run unit tests
        shell: bash
        env:
          THINN_FIREBASE_APP_ID: ${{ vars.THINN_FIREBASE_APP_ID }}
          THINN_FIREBASE_API_KEY: ${{ vars.THINN_FIREBASE_API_KEY }}
          THINN_FIREBASE_SENDER_ID: ${{ vars.THINN_FIREBASE_SENDER_ID }}
          THINN_FIREBASE_PROJECT_ID: ${{ vars.THINN_FIREBASE_PROJECT_ID }}
          THINN_PUSH_FUNCTIONS_REGION: ${{ vars.THINN_PUSH_FUNCTIONS_REGION }}
        run: |
          set -euo pipefail
          project=extracted/thinn-khi_Android_Project
          args=(--no-daemon --console=plain --project-dir "$project"
             -PTHINN_VERSION_CODE="$((22000000 + GITHUB_RUN_NUMBER))"
             -PTHINN_VERSION_NAME="22.0.$GITHUB_RUN_NUMBER"
             -PTHINN_FIREBASE_APP_ID="${THINN_FIREBASE_APP_ID:-}"
             -PTHINN_FIREBASE_API_KEY="${THINN_FIREBASE_API_KEY:-}"
             -PTHINN_FIREBASE_SENDER_ID="${THINN_FIREBASE_SENDER_ID:-}"
             -PTHINN_FIREBASE_PROJECT_ID="${THINN_FIREBASE_PROJECT_ID:-}"
             -PTHINN_PUSH_FUNCTIONS_REGION="${THINN_PUSH_FUNCTIONS_REGION:-asia-east1}")
          gradle "${args[@]}" :app:testDebugUnitTest 2>&1 | tee build.log
          if [[ "$SIGN_READY" == 'true' ]]; then task=:app:assembleRelease; else task=:app:assembleDebug; fi
          gradle "${args[@]}" "$task" 2>&1 | tee -a build.log
      - name: Upload CI diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V22-build-errors
          path: build.log
          if-no-files-found: ignore
      - name: Sign and verify same-package official OTA
        if: env.SIGN_READY == 'true'
        shell: bash
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          input=extracted/thinn-khi_Android_Project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$input"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$input" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/thinn-release.jks" --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass env:APK_KEYSTORE_PASSWORD --key-pass env:APK_KEY_PASSWORD \
            --out thinn-khi.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs thinn-khi.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging thinn-khi.apk > "$RUNNER_TEMP/badging.txt"
          grep -q "name='io.atmos.weather'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='$((22000000 + GITHUB_RUN_NUMBER))'" "$RUNNER_TEMP/badging.txt"
          sha256sum thinn-khi.apk > thinn-khi.apk.sha256
          rm -f "$RUNNER_TEMP/thinn-release.jks"
      - name: Signed OTA artifacts
        if: env.SIGN_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V22-SIGNED-APK
          path: |
            thinn-khi.apk
            thinn-khi.apk.sha256
      - name: Debug test artifact (NOT OTA)
        if: env.SIGN_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V22-TEST-APK-NOT-OTA
          path: extracted/thinn-khi_Android_Project/app/build/outputs/apk/debug/*.apk
      - name: Publish official OTA GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && env.SIGN_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="22.0.$GITHUB_RUN_NUMBER"
          gh release create "v$version" thinn-khi.apk thinn-khi.apk.sha256 \
            --target "$GITHUB_SHA" --title "thinn-khì $version" \
            --notes-file extracted/thinn-khi_Android_Project/app/src/main/assets/current_release_notes.md --latest
