name: Build thinn-khi V15.0 ExpTech Realtime EEW APK and OTA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a signed OTA Release (requires all 4 signing secrets)'
        type: boolean
        required: true
        default: false
      release_notes:
        description: 'Optional: full Release Notes; blank uses full notes bundled in source ZIP'
        type: string
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Determine signing mode
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          PUBLISH_RELEASE: ${{ inputs.publish_release == true }}
        shell: bash
        run: |
          set -euo pipefail
          SIGN_READY=true
          for name in APK_KEYSTORE_BASE64 APK_KEYSTORE_PASSWORD APK_KEY_PASSWORD APK_KEY_ALIAS; do
            if [[ -z "${!name:-}" ]]; then
              SIGN_READY=false
              echo "::notice::Missing $name; test debug APK only until fixed signing credentials are configured."
            fi
          done
          echo "SIGN_READY=$SIGN_READY" >> "$GITHUB_ENV"
          if [[ "$PUBLISH_RELEASE" == 'true' && "$SIGN_READY" != 'true' ]]; then
            echo '::error::Cannot publish OTA without a persistent release signing key.'
            exit 1
          fi
          if [[ "$SIGN_READY" == 'true' ]]; then
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/thinn-khi-release.jks"
            chmod 600 "$RUNNER_TEMP/thinn-khi-release.jks"
            keytool -list -keystore "$RUNNER_TEMP/thinn-khi-release.jks" \
              -alias "$APK_KEY_ALIAS" -storepass "$APK_KEYSTORE_PASSWORD" > /dev/null
          fi

      - name: Extract V15.0 source
        shell: bash
        run: |
          set -euo pipefail
          test -s thinn-khi_Android_Source_V15_0_ExpTech_Realtime_EEW.zip || {
            echo '::error::Upload thinn-khi_Android_Source_V15_0_ExpTech_Realtime_EEW.zip to the repository root.'; exit 1;
          }
          mkdir -p extracted
          unzip -qo thinn-khi_Android_Source_V15_0_ExpTech_Realtime_EEW.zip -d extracted
          PROJECT_DIR=extracted/thinn-khi_Android_Project
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'import androidx.compose.animation.animateColorAsState' \
            "$PROJECT_DIR/app/src/main/java/io/atmos/weather/presentation/home/WeatherHomeScreen.kt" || {
            echo '::error::Fixed source package is missing the Compose animation import.'; exit 1;
          }
          for tone in clear_bell crystal morning raindrop starlight breeze clear_sky ripple; do
            test -s "$PROJECT_DIR/app/src/main/res/raw/thinn_notify_${tone}.ogg" || {
              echo "::error::Missing notification tone: $tone"; exit 1;
            }
          done
          grep -Fq 'ThinnNotificationChannels.channelId(ctx, ThinnNotificationChannels.Type.UPDATES)' \
            "$PROJECT_DIR/app/src/main/java/io/atmos/weather/update/UpdateCheckWorker.kt" || {
            echo '::error::Update notifications are not using the new custom chime channel.'; exit 1;
          }
          test -s "$PROJECT_DIR/app/src/main/java/io/atmos/weather/earthquake/EarthquakeCenterPage.kt"
          test -s "$PROJECT_DIR/app/src/main/java/io/atmos/weather/earthquake/CwaEarthquakeRepository.kt"
          test -s "$PROJECT_DIR/app/src/main/java/io/atmos/weather/earthquake/SeismicExperience.kt"
          test -s "$PROJECT_DIR/app/src/main/java/io/atmos/weather/earthquake/ExpTechRealtimeModels.kt"
          test -s "$PROJECT_DIR/app/src/main/java/io/atmos/weather/earthquake/ExpTechSeismicService.kt"
          test -s "$PROJECT_DIR/app/src/main/res/raw/thinn_eew_warning.ogg"
          for sound in drill_alert step allclear; do
            test -s "$PROJECT_DIR/app/src/main/res/raw/thinn_seismic_${sound}.ogg" || {
              echo "::error::Missing original seismic experience sound: $sound"; exit 1;
            }
          done
          test -s "$PROJECT_DIR/app/src/main/assets/current_release_notes.md"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((15000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=15.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Bundle current release notes into this APK
        shell: bash
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          NOTES_FILE="$PROJECT_DIR/app/src/main/assets/current_release_notes.md"
          # Exactly the same content is used in the installed-App panel and GitHub Release.
          if [[ -n "${RELEASE_NOTES:-}" ]]; then
            printf '%s\n' "$RELEASE_NOTES" > "$NOTES_FILE"
          fi
          test -s "$NOTES_FILE"
          echo "RELEASE_NOTES_PATH=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Prepare rain and thunder recordings
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 "$PROJECT_DIR/tools/prepare_real_weather_audio.py"
          for name in light_rain heavy_rain thunder_strike; do
            test -s "$PROJECT_DIR/app/src/main/res/raw/$name.ogg"
          done

      - name: Compile Android APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SIGN_READY" == 'true' ]]; then
            task=:app:assembleRelease
          else
            task=:app:assembleDebug
          fi
          gradle --no-daemon --console=plain --project-dir "$PROJECT_DIR" \
            -PTHINN_VERSION_CODE="$VERSION_CODE" -PTHINN_VERSION_NAME="$VERSION_NAME" \
            "$task" 2>&1 | tee build.log

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V15_0-errors
          path: build.log
          if-no-files-found: ignore

      - name: Sign official OTA APK with persistent key
        if: env.SIGN_READY == 'true'
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/thinn-khi-release.jks" \
            --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass env:APK_KEYSTORE_PASSWORD \
            --key-pass env:APK_KEY_PASSWORD \
            --out thinn-khi.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs thinn-khi.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging thinn-khi.apk | head -n 3
          sha256sum thinn-khi.apk > thinn-khi.apk.sha256
          rm -f "$RUNNER_TEMP/thinn-khi-release.jks"

      - name: Upload official signed APK
        if: env.SIGN_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V15_0-SIGNED-APK
          path: |
            thinn-khi.apk
            thinn-khi.apk.sha256
          if-no-files-found: error

      - name: Upload preview debug APK
        if: env.SIGN_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V15_0-TEST-APK-NOT-OTA
          path: extracted/thinn-khi_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish signed GitHub OTA Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && env.SIGN_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION_NAME}" thinn-khi.apk thinn-khi.apk.sha256 \
            --title "thinn-khi ${VERSION_NAME}" \
            --notes-file "$RELEASE_NOTES_PATH" \
            --latest
