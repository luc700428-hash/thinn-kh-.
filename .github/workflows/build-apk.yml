name: Build thinn-khi V7 APK (fixed)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract V7 app
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f thinn-khi_Android_Source_V7_FIXED.zip ]]; then
            ARCHIVE=thinn-khi_Android_Source_V7_FIXED.zip
          elif [[ -f thinn-khi_Android_Source_V7.zip ]]; then
            ARCHIVE=thinn-khi_Android_Source_V7.zip
          else
            echo 'ERROR: Missing V7 Android ZIP at repository root.'
            exit 1
          fi
          mkdir -p extracted
          unzip -qo "$ARCHIVE" -d extracted
          PROJECT_DIR=extracted/thinn-khi_Android_Project
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Widget county label in V7 source
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          p = Path(os.environ['PROJECT_DIR']) / 'app/src/main/java/io/atmos/weather/widgets/AtmosWidgets.kt'
          s = p.read_text(encoding='utf-8')
          prefix = 'private fun LandmarkId.label()=when(this){'
          if prefix not in s:
              raise SystemExit('Unexpected Widget source: LandmarkId.label() not found')
          head, tail = s.split(prefix, 1)
          if 'LandmarkId.TAIWAN_COUNTY' not in tail:
              needle = 'LandmarkId.WEATHER_COTTAGE->"微縮氣象小屋"'
              if needle not in tail:
                  raise SystemExit('Unexpected Widget source: original label branch not found')
              tail = tail.replace(needle,'LandmarkId.TAIWAN_COUNTY->"縣市微縮景觀";'+needle, 1)
              p.write_text(head + prefix + tail, encoding='utf-8')
          print('Widget TAIWAN_COUNTY branch present')
          PYTHON

      - name: Compile V7 debug APK
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain --project-dir "$PROJECT_DIR" :app:assembleDebug 2>&1 | tee build.log

      - name: Print compiler errors
        if: steps.compile.outcome == 'failure'
        shell: bash
        run: |
          grep -n -E '(e: file:|Unresolved reference|Type mismatch|[Ee]rror:|Compilation error|^FAILURE:)' build.log | head -120 > compiler-errors.txt || true
          if [[ ! -s compiler-errors.txt ]]; then tail -120 build.log > compiler-errors.txt; fi
          echo '### thinn-khì V7 build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat compiler-errors.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload errors
        if: steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V7-compile-errors
          path: |
            build.log
            compiler-errors.txt
          if-no-files-found: error

      - name: Upload APK
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: thinn-khi-V7-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail the job if compilation failed
        if: steps.compile.outcome == 'failure'
        run: exit 1
